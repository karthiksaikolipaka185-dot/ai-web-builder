name: Production Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke-test:
    name: Verify Production Health
    runs-on: ubuntu-latest
    steps:
      - name: Poll Production Health Endpoint
        env:
          PRODUCTION_URL: https://ai-web-builder-1-8bm9.onrender.com/api/health
        run: |
          echo "Starting production health check for: $PRODUCTION_URL"
          MAX_ATTEMPTS=30
          SLEEP_SECONDS=10
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS: Checking endpoint..."
            HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" --max-time 10 "$PRODUCTION_URL" || echo "000")

            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "SUCCESS: Production backend responded with HTTP 200 OK."
              cat response.json
              echo ""
              exit 0
            fi

            echo "Endpoint returned HTTP $HTTP_STATUS. Waiting $SLEEP_SECONDS seconds for deployment/spin-up..."
            sleep $SLEEP_SECONDS
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "ERROR: Production health check timed out after 5 minutes."
          exit 1
